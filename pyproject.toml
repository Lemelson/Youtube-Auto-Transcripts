[build-system]
requires = ["setuptools>=65", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "youtube-auto-transcripts"
version = "0.1.0"
description = "Local CLI tool for collecting YouTube metadata, transcripts, and comments"
readme = "README.md"
authors = [
  { name = "Lemelson" }
]
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = [
  "youtube-transcript-api>=0.6.2",
  "requests>=2.31.0"
]

[project.optional-dependencies]
whisper = [
  "faster-whisper>=1.0.0"
]

[project.scripts]
youtube-auto-transcripts = "youtube_auto_transcripts.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
